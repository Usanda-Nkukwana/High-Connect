include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # DropdownButtonFormField.value is deprecated on the newest Flutter but still
    # works on every version this project supports.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
